<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Package/Box shape -->
  <rect x="20" y="35" width="60" height="45" fill="#d4af86" stroke="#1a1a1a" stroke-width="2" rx="3"/>
  <!-- Box flaps -->
  <line x1="20" y1="35" x2="35" y2="20" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="35" x2="65" y2="20" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="35,20 65,20 60,30 40,30" fill="#d4af86" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Shield outline for protection -->
  <circle cx="50" cy="60" r="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Checkmark in circle -->
  <path d="M 45 60 L 48 63 L 55 56" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>